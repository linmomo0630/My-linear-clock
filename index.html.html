<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>我的線性時鐘</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0d16;
    --bg-grid: rgba(139, 123, 255, 0.05);
    --panel: #10141f;
    --border: #1e2436;
    --fg: #e7e9f2;
    --muted: #6b7280;
    --accent: #8b7bff;
    --accent-glow: rgba(139, 123, 255, 0.55);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 50% 0%, rgba(139,123,255,0.08), transparent 60%),
      var(--bg);
    color: var(--fg);
    font-family: 'Inter', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 60px;
  }

  h1 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.1rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 4px;
  }
  .subtitle { color: var(--muted); font-size: 0.85rem; margin: 0 0 28px; }

  #liveTime {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(2.6rem, 9vw, 4.6rem);
    font-weight: 700;
    color: var(--fg);
    text-shadow: 0 0 24px var(--accent-glow);
    letter-spacing: 2px;
  }
  #dateLine { font-family: 'JetBrains Mono', monospace; color: var(--muted); font-size: 0.9rem; margin-bottom: 28px; }

  /* ===== 工具列(顏色 / 刻度單位 / 管理時段) ===== */
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    justify-content: center;
    margin-bottom: 24px;
  }
  .toolbar label {
    font-size: 0.78rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .toolbar select, .toolbar input[type="color"] {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--fg);
    border-radius: 8px;
    padding: 5px 8px;
    font-family: 'Inter', sans-serif;
    font-size: 0.8rem;
  }
  .toolbar input[type="color"] {
    padding: 2px;
    width: 40px;
    height: 30px;
    cursor: pointer;
  }
  .btn {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--fg);
    border-radius: 8px;
    padding: 6px 14px;
    font-size: 0.8rem;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.danger:hover { border-color: #f87171; color: #f87171; }

  .track-wrap { width: min(92%, 900px); }

  .track {
    position: relative;
    height: 46px;
    border-radius: 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    overflow: hidden;
  }
  .zone { position: absolute; top: 0; height: 100%; opacity: 0.55; }

  .marker {
    position: absolute;
    top: -4px;
    width: 3px;
    height: calc(100% + 8px);
    background: var(--accent);
    box-shadow: 0 0 12px 2px var(--accent-glow);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 10px 2px var(--accent-glow); }
    50% { box-shadow: 0 0 20px 5px var(--accent-glow); }
  }

  .hour-ticks { position: relative; height: 18px; margin-top: 6px; }
  .hour-ticks span {
    position: absolute;
    transform: translateX(-50%);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
  }

  .legend { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; margin-top: 24px; }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--muted); }
  .swatch { width: 10px; height: 10px; border-radius: 3px; }

  .stats { display: flex; gap: 16px; margin-top: 30px; flex-wrap: wrap; justify-content: center; }
  .stat-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 24px;
    min-width: 150px;
    text-align: center;
  }
  .stat-card .value { font-family: 'JetBrains Mono', monospace; font-size: 1.4rem; font-weight: 600; color: var(--accent); }
  .stat-card .label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }

  /* ===== 時段編輯面板 ===== */
  #zoneEditor {
    width: min(92%, 900px);
    margin-top: 36px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
  }
  #zoneEditor h2 {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin: 0 0 14px;
  }
  .zone-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
  }
  .zone-row:last-of-type { border-bottom: none; }
  .zone-row input[type="text"] {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--fg);
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 0.8rem;
    width: 100px;
  }
  .zone-row input[type="time"] {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--fg);
    border-radius: 6px;
    padding: 4px 6px;
    font-size: 0.78rem;
  }
  .zone-row input[type="color"] {
    width: 34px; height: 28px; padding: 2px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px; cursor: pointer;
  }
  #addZoneBtn { margin-top: 12px; }
</style>
</head>
<body>

  <h1>My Linear Clock</h1>
  <p class="subtitle">從零打造 · 屬於我自己的版本</p>

  <div id="liveTime">--:--:--</div>
  <div id="dateLine">--</div>

  <div class="toolbar">
    <label>主題色
      <input type="color" id="accentPicker" />
    </label>
    <label>刻度單位
      <select id="tickIntervalSelect">
        <option value="15">15 分鐘</option>
        <option value="30">30 分鐘</option>
        <option value="60">1 小時</option>
        <option value="120">2 小時</option>
        <option value="180">3 小時</option>
        <option value="240">4 小時</option>
      </select>
    </label>
  </div>

  <div class="track-wrap">
    <div class="track" id="track">
      <div class="marker" id="marker"></div>
    </div>
    <div class="hour-ticks" id="hourTicks"></div>
  </div>

  <div class="legend" id="legend"></div>

  <div class="stats">
    <div class="stat-card">
      <div class="value" id="pctElapsed">--%</div>
      <div class="label">今日已過</div>
    </div>
    <div class="stat-card">
      <div class="value" id="timeLeft">--:--:--</div>
      <div class="label">剩餘時間</div>
    </div>
    <div class="stat-card">
      <div class="value" id="currentZoneLabel">--</div>
      <div class="label">目前時段</div>
    </div>
  </div>

  <div id="zoneEditor">
    <h2>管理時段</h2>
    <div id="zoneList"></div>
    <button class="btn" id="addZoneBtn">+ 新增時段</button>
  </div>

<script>
  // ===== 預設值(只有在使用者第一次打開、localStorage 還沒有資料時才會用到) =====
  const DEFAULT_ZONES = [
    { name: "睡眠",   start: 0,  end: 6,  color: "#3b4560" },
    { name: "晨間準備", start: 6,  end: 9,  color: "#ffb454" },
    { name: "工作",   start: 9,  end: 18, color: "#4cc2ff" },
    { name: "晚間",   start: 18, end: 24, color: "#b892ff" },
  ];
  const DEFAULT_ACCENT = "#8b7bff";
  const DEFAULT_TICK_MIN = 180; // 3 小時一格

  const LS_ZONES = "myClock_zones";
  const LS_ACCENT = "myClock_accent";
  const LS_TICK = "myClock_tickIntervalMin";

  let zones = [];
  let tickIntervalMin = DEFAULT_TICK_MIN;

  // ===== 讀取 / 儲存(localStorage) =====
  function loadState() {
    try {
      const rawZones = localStorage.getItem(LS_ZONES);
      zones = rawZones ? JSON.parse(rawZones) : JSON.parse(JSON.stringify(DEFAULT_ZONES));
    } catch { zones = JSON.parse(JSON.stringify(DEFAULT_ZONES)); }

    const accent = localStorage.getItem(LS_ACCENT) || DEFAULT_ACCENT;
    applyAccent(accent);
    document.getElementById("accentPicker").value = accent;

    tickIntervalMin = parseInt(localStorage.getItem(LS_TICK), 10) || DEFAULT_TICK_MIN;
    document.getElementById("tickIntervalSelect").value = String(tickIntervalMin);
  }
  function saveZones() { localStorage.setItem(LS_ZONES, JSON.stringify(zones)); }
  function saveAccent(hex) { localStorage.setItem(LS_ACCENT, hex); }
  function saveTickInterval() { localStorage.setItem(LS_TICK, String(tickIntervalMin)); }

  // ===== 顏色工具:把選好的主題色套用到 CSS 變數(含發光的半透明版本) =====
  function hexToRgba(hex, alpha) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
  }
  function applyAccent(hex) {
    document.documentElement.style.setProperty("--accent", hex);
    document.documentElement.style.setProperty("--accent-glow", hexToRgba(hex, 0.55));
    document.documentElement.style.setProperty("--bg-grid", hexToRgba(hex, 0.05));
  }

  // ===== 畫時段色塊 + 圖例(每次時段資料變動後,重新畫過) =====
  const track = document.getElementById("track");
  const marker = document.getElementById("marker");
  const legend = document.getElementById("legend");

  function renderZonesAndLegend() {
    track.querySelectorAll(".zone").forEach((el) => el.remove());
    legend.innerHTML = "";

    zones.forEach((z) => {
      const el = document.createElement("div");
      el.className = "zone";
      el.style.left = (z.start / 24 * 100) + "%";
      el.style.width = ((z.end - z.start) / 24 * 100) + "%";
      el.style.background = z.color;
      track.appendChild(el);

      const item = document.createElement("div");
      item.className = "legend-item";
      item.innerHTML = `<span class="swatch" style="background:${z.color}"></span>${z.name}`;
      legend.appendChild(item);
    });
  }

  // ===== 畫刻度(依照使用者選擇的單位,分鐘轉換成小時後畫在對應位置) =====
  const hourTicks = document.getElementById("hourTicks");
  function renderTicks() {
    hourTicks.innerHTML = "";
    const stepHours = tickIntervalMin / 60;
    for (let h = 0; h <= 24 + 1e-6; h += stepHours) {
      const span = document.createElement("span");
      const hh = Math.floor(h) % 24;
      const mm = Math.round((h - Math.floor(h)) * 60);
      span.textContent = String(hh).padStart(2, "0") + ":" + String(mm).padStart(2, "0");
      span.style.left = (Math.min(h, 24) / 24 * 100) + "%";
      hourTicks.appendChild(span);
    }
  }

  function findCurrentZone(hourFloat) {
    return zones.find((z) => hourFloat >= z.start && hourFloat < z.end);
  }

  // ===== 每秒更新一次 =====
  function tick() {
    const now = new Date();
    const h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
    const hourFloat = h + m / 60 + s / 3600;

    marker.style.left = (hourFloat / 24 * 100) + "%";

    document.getElementById("liveTime").textContent =
      `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
    document.getElementById("dateLine").textContent =
      now.toLocaleDateString("zh-TW", { year: "numeric", month: "long", day: "numeric", weekday: "long" });

    const secondsSinceMidnight = h * 3600 + m * 60 + s;
    const totalSeconds = 86400;
    const pct = (secondsSinceMidnight / totalSeconds * 100).toFixed(1);
    const remain = totalSeconds - secondsSinceMidnight;
    const rh = String(Math.floor(remain / 3600)).padStart(2, "0");
    const rm = String(Math.floor((remain % 3600) / 60)).padStart(2, "0");
    const rs = String(remain % 60).padStart(2, "0");

    document.getElementById("pctElapsed").textContent = pct + "%";
    document.getElementById("timeLeft").textContent = `${rh}:${rm}:${rs}`;

    const currentZone = findCurrentZone(hourFloat);
    document.getElementById("currentZoneLabel").textContent = currentZone ? currentZone.name : "--";
  }

  // ===== 時段編輯面板:把 zones 陣列畫成一排一排可編輯的欄位 =====
  function hourToTimeStr(hourFloat) {
    const hh = Math.floor(hourFloat);
    const mm = Math.round((hourFloat - hh) * 60);
    return String(hh).padStart(2, "0") + ":" + String(mm).padStart(2, "0");
  }
  function timeStrToHour(timeStr) {
    const [hh, mm] = timeStr.split(":").map(Number);
    return hh + mm / 60;
  }

  const zoneList = document.getElementById("zoneList");

  function renderZoneEditor() {
    zoneList.innerHTML = "";
    zones.forEach((z, idx) => {
      const row = document.createElement("div");
      row.className = "zone-row";
      row.innerHTML = `
        <input type="text" value="${z.name}" data-field="name" />
        <input type="time" value="${hourToTimeStr(z.start)}" data-field="start" />
        <span style="color:var(--muted);font-size:0.75rem;">至</span>
        <input type="time" value="${hourToTimeStr(z.end)}" data-field="end" />
        <input type="color" value="${z.color}" data-field="color" />
        <button class="btn danger" data-action="delete">刪除</button>
      `;

      row.querySelectorAll("input").forEach((input) => {
        input.addEventListener("change", () => {
          const field = input.dataset.field;
          if (field === "name") zones[idx].name = input.value.trim() || "未命名時段";
          if (field === "start") zones[idx].start = timeStrToHour(input.value);
          if (field === "end") zones[idx].end = timeStrToHour(input.value);
          if (field === "color") zones[idx].color = input.value;
          saveZones();
          renderZonesAndLegend();
          tick();
        });
      });

      row.querySelector('[data-action="delete"]').addEventListener("click", () => {
        zones.splice(idx, 1);
        saveZones();
        renderZoneEditor();
        renderZonesAndLegend();
        tick();
      });

      zoneList.appendChild(row);
    });
  }

  document.getElementById("addZoneBtn").addEventListener("click", () => {
    zones.push({ name: "新時段", start: 12, end: 13, color: "#4cc2ff" });
    saveZones();
    renderZoneEditor();
    renderZonesAndLegend();
    tick();
  });

  document.getElementById("accentPicker").addEventListener("input", (e) => {
    applyAccent(e.target.value);
    saveAccent(e.target.value);
  });

  document.getElementById("tickIntervalSelect").addEventListener("change", (e) => {
    tickIntervalMin = parseInt(e.target.value, 10);
    saveTickInterval();
    renderTicks();
  });

  // ===== 啟動 =====
  loadState();
  renderZonesAndLegend();
  renderTicks();
  renderZoneEditor();
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
