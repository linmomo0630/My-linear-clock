<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>我的線性時鐘</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0d16;
    --bg-grid: rgba(139, 123, 255, 0.05);
    --panel: #10141f;
    --border: #1e2436;
    --fg: #e7e9f2;
    --muted: #6b7280;
    --accent: #8b7bff;
    --accent-glow: rgba(139, 123, 255, 0.55);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 50% 0%, rgba(139,123,255,0.08), transparent 60%),
      var(--bg);
    color: var(--fg);
    font-family: 'Inter', sans-serif;
    padding: 48px 0 60px;
  }

  .page-header { text-align: center; margin-bottom: 32px; }
  h1 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.1rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 4px;
  }
  .subtitle { color: var(--muted); font-size: 0.85rem; margin: 0; }

  /* ===== 可拖動面板的畫布 ===== */
  #canvasWrap { width: 100%; overflow-x: auto; padding: 0 20px; }
  #canvas {
    position: relative;
    width: 1240px;
    max-width: none;
    height: 680px;
    margin: 0 auto;
    background-image: none;
    transition: background-image 0.15s;
  }
  body.edit-mode #canvas {
    background-image:
      linear-gradient(to right, rgba(139,123,255,0.14) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(139,123,255,0.14) 1px, transparent 1px);
    background-size: var(--grid-size, 20px) var(--grid-size, 20px);
  }

  .widget {
    position: absolute;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    overflow: auto;
    resize: none;
    min-width: 240px;
    min-height: 160px;
    transition: border-color 0.15s, background 0.15s;
  }
  body.edit-mode .widget {
    background: var(--panel);
    border-color: var(--border);
    resize: both;
  }
  /* 個別面板選擇「固定顯示底框」時,不論檢視或編輯模式都保留卡片外觀 */
  .widget.show-card {
    background: var(--panel);
    border-color: var(--border);
  }
  .widget-handle {
    display: none;
    cursor: grab;
    padding: 8px 14px;
    font-size: 0.68rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    user-select: none;
    flex-shrink: 0;
  }
  body.edit-mode .widget-handle { display: block; }
  .widget-handle:active { cursor: grabbing; }
  .widget-body {
    padding: 12px 16px;
    overflow: auto;
    flex: 1;
    display: flex;
    flex-direction: column;
    container-type: inline-size;
  }

  #liveTime {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(1.8rem, 17cqw, 3.6rem);
    font-weight: 700;
    color: var(--fg);
    text-shadow: 0 0 24px var(--accent-glow);
    letter-spacing: 2px;
    text-align: center;
  }
  #dateLine {
    font-family: 'JetBrains Mono', monospace;
    color: var(--muted);
    font-size: clamp(0.7rem, 3.2cqw, 0.95rem);
    margin-bottom: 20px;
    text-align: center;
  }

  /* ===== 時間軸主體 ===== */
  .track {
    position: relative;
    height: 46px;
    border-radius: 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    overflow: hidden;
    flex-shrink: 0;
  }
  .zone { position: absolute; top: 0; height: 100%; opacity: 0.55; }

  .tick-mark {
    position: absolute;
    top: 0;
    height: 100%;
    width: 1px;
    background: rgba(255, 255, 255, 0.32);
  }
  .tick-mark.major { background: rgba(255, 255, 255, 0.55); width: 1px; }

  .marker {
    position: absolute;
    top: -4px;
    width: 3px;
    height: calc(100% + 8px);
    background: var(--accent);
    box-shadow: 0 0 12px 2px var(--accent-glow);
    animation: pulse 2.4s ease-in-out infinite;
    z-index: 2;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 10px 2px var(--accent-glow); }
    50% { box-shadow: 0 0 20px 5px var(--accent-glow); }
  }

  .hour-ticks { position: relative; height: 18px; margin-top: 6px; flex-shrink: 0; }
  .hour-ticks span {
    position: absolute;
    transform: translateX(-50%);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
  }

  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 18px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--muted); }
  .swatch { width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; }

  /* ===== 統計面板 ===== */
  .widget-body.centered { align-items: center; justify-content: center; text-align: center; }
  .big-stat .value { font-family: 'JetBrains Mono', monospace; font-size: clamp(1.1rem, 15cqw, 2rem); font-weight: 600; color: var(--accent); }
  .big-stat .label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 6px; }

  /* ===== 待辦/任務面板共用樣式 ===== */
  .list-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    flex-shrink: 0;
  }
  .list-header h3 {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin: 0;
  }
  .list-status { font-size: 0.7rem; color: var(--muted); }
  .list-status.error { color: #f87171; }
  .item-list { list-style: none; margin: 0; padding: 0; overflow: auto; }
  .item-list li {
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.85rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .item-list li:last-child { border-bottom: none; }
  .item-list li::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }

  /* ===== 設定按鈕 ===== */
  #settingsToggle {
    position: fixed;
    top: 20px;
    left: 20px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 1.2rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    transition: color 0.15s, border-color 0.15s;
  }
  #settingsToggle:hover { color: var(--accent); border-color: var(--accent); }

  #editModeToggle {
    position: fixed;
    top: 20px;
    left: 72px;
    height: 42px;
    padding: 0 16px;
    border-radius: 21px;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.8rem;
    cursor: pointer;
    z-index: 100;
    transition: color 0.15s, border-color 0.15s;
  }
  #editModeToggle:hover { color: var(--accent); border-color: var(--accent); }
  #editModeToggle.active { color: var(--accent); border-color: var(--accent); background: rgba(139,123,255,0.1); }

  /* ===== 側邊設定抽屜(左側) ===== */
  #drawerOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    z-index: 200;
  }
  #drawerOverlay.open { opacity: 1; pointer-events: auto; }

  #settingsDrawer {
    position: fixed;
    top: 0;
    left: 0;
    height: 100vh;
    width: min(85vw, 340px);
    background: var(--panel);
    border-right: 1px solid var(--border);
    transform: translateX(-100%);
    transition: transform 0.25s ease;
    z-index: 201;
    overflow-y: auto;
    padding: 20px;
  }
  #settingsDrawer.open { transform: translateX(0); }

  .drawer-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  .drawer-header h2 { font-size: 0.95rem; letter-spacing: 1px; margin: 0; }
  #closeDrawer {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 1.3rem;
    cursor: pointer;
    line-height: 1;
  }
  #closeDrawer:hover { color: var(--fg); }

  .drawer-section {
    margin-bottom: 26px;
    padding-bottom: 22px;
    border-bottom: 1px solid var(--border);
  }
  .drawer-section:last-child { border-bottom: none; }
  .drawer-section h3 {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin: 0 0 12px;
  }

  .drawer-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
  }
  .drawer-row label { font-size: 0.85rem; color: var(--fg); }

  select, input[type="color"], input[type="text"], input[type="time"] {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--fg);
    border-radius: 6px;
    padding: 5px 8px;
    font-family: 'Inter', sans-serif;
    font-size: 0.8rem;
  }
  input[type="color"] { padding: 2px; width: 40px; height: 30px; cursor: pointer; }

  .btn {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--fg);
    border-radius: 8px;
    padding: 6px 14px;
    font-size: 0.8rem;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.danger:hover { border-color: #f87171; color: #f87171; }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn:disabled:hover { border-color: var(--border); color: var(--fg); }
  .btn.full { width: 100%; }

  .zone-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
  }
  .zone-row:last-of-type { border-bottom: none; }
  .zone-row input[type="text"] { width: 76px; }
  .zone-row input[type="time"] { font-size: 0.72rem; padding: 4px 5px; }
  .zone-row input[type="color"] { width: 30px; height: 26px; }
  #addZoneBtn { margin-top: 10px; width: 100%; }

  .template-label { display: block; font-size: 0.85rem; color: var(--fg); margin-bottom: 8px; }
  .template-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .template-controls select { flex: 1 1 100px; min-width: 90px; }
  .icon-btn {
    width: 30px; height: 30px; padding: 0; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
</style>
</head>
<body>

  <button id="settingsToggle" title="設定" aria-label="開啟設定">⚙</button>
  <button id="editModeToggle" title="切換編輯模式">✏ 編輯版面</button>

  <div class="page-header">
    <h1>My Linear Clock</h1>
    <p class="subtitle">從零打造 · 屬於我自己的版本</p>
  </div>

  <div id="canvasWrap">
    <div id="canvas">

      <!-- ===== 時鐘面板 ===== -->
      <div class="widget" id="widget-clock" data-widget="clock">
        <div class="widget-handle">⠿⠿ 時鐘</div>
        <div class="widget-body">
          <div id="liveTime">--:--:--</div>
          <div id="dateLine">--</div>
          <div class="track" id="track">
            <div class="marker" id="marker"></div>
          </div>
          <div class="hour-ticks" id="hourTicks"></div>
          <div class="legend" id="legend"></div>
        </div>
      </div>

      <!-- ===== 統計:四個獨立面板 ===== -->
      <div class="widget" id="widget-statElapsed" data-widget="statElapsed">
        <div class="widget-handle">⠿⠿ 今日已過</div>
        <div class="widget-body centered">
          <div class="big-stat">
            <div class="value" id="pctElapsed">--%</div>
            <div class="label">今日已過</div>
          </div>
        </div>
      </div>

      <div class="widget" id="widget-statRemaining" data-widget="statRemaining">
        <div class="widget-handle">⠿⠿ 剩餘時間</div>
        <div class="widget-body centered">
          <div class="big-stat">
            <div class="value" id="timeLeft">--:--:--</div>
            <div class="label">剩餘時間</div>
          </div>
        </div>
      </div>

      <div class="widget" id="widget-statCurrent" data-widget="statCurrent">
        <div class="widget-handle">⠿⠿ 目前時段</div>
        <div class="widget-body centered">
          <div class="big-stat">
            <div class="value" id="currentZoneLabel">--</div>
            <div class="label" id="currentZoneSubLabel">目前時段</div>
          </div>
        </div>
      </div>

      <div class="widget" id="widget-statNext" data-widget="statNext">
        <div class="widget-handle">⠿⠿ 下一個時段</div>
        <div class="widget-body centered">
          <div class="big-stat">
            <div class="value" id="nextZoneLabel">--</div>
            <div class="label">下一個時段</div>
          </div>
        </div>
      </div>

      <!-- ===== 待辦事項面板 ===== -->
      <div class="widget" id="widget-todo" data-widget="todo">
        <div class="widget-handle">⠿⠿ 待辦事項</div>
        <div class="widget-body">
          <div class="list-header">
            <h3>待辦事項</h3>
            <span id="todoStatus" class="list-status">連接中...</span>
          </div>
          <ul id="todoList" class="item-list"></ul>
        </div>
      </div>

      <!-- ===== 今日任務面板 ===== -->
      <div class="widget" id="widget-tasks" data-widget="tasks">
        <div class="widget-handle">⠿⠿ 今日任務</div>
        <div class="widget-body">
          <div class="list-header">
            <h3>今日任務</h3>
            <span id="tasksStatus" class="list-status">連接中...</span>
          </div>
          <ul id="tasksList" class="item-list"></ul>
        </div>
      </div>

    </div>
  </div>

  <!-- ===== 側邊設定抽屜 ===== -->
  <div id="drawerOverlay"></div>
  <div id="settingsDrawer">
    <div class="drawer-header">
      <h2>設定</h2>
      <button id="closeDrawer" aria-label="關閉設定">✕</button>
    </div>

    <div class="drawer-section">
      <h3>版面</h3>
      <div class="drawer-row">
        <label for="snapToggle">對齊格線</label>
        <input type="checkbox" id="snapToggle" />
      </div>
      <div class="drawer-row">
        <label for="gridSizeSelect">格線大小</label>
        <select id="gridSizeSelect">
          <option value="10">10px(精細)</option>
          <option value="20">20px</option>
          <option value="40">40px</option>
          <option value="60">60px(寬鬆)</option>
        </select>
      </div>
      <button class="btn full" id="resetLayoutBtn">重設面板位置與大小</button>
    </div>

    <div class="drawer-section">
      <h3>面板外觀</h3>
      <div class="drawer-row">
        <label for="cardToggle-clock">時鐘顯示底框</label>
        <input type="checkbox" id="cardToggle-clock" data-widget="clock" />
      </div>
      <div class="drawer-row">
        <label for="cardToggle-statElapsed">今日已過顯示底框</label>
        <input type="checkbox" id="cardToggle-statElapsed" data-widget="statElapsed" />
      </div>
      <div class="drawer-row">
        <label for="cardToggle-statRemaining">剩餘時間顯示底框</label>
        <input type="checkbox" id="cardToggle-statRemaining" data-widget="statRemaining" />
      </div>
      <div class="drawer-row">
        <label for="cardToggle-statCurrent">目前時段顯示底框</label>
        <input type="checkbox" id="cardToggle-statCurrent" data-widget="statCurrent" />
      </div>
      <div class="drawer-row">
        <label for="cardToggle-statNext">下一個時段顯示底框</label>
        <input type="checkbox" id="cardToggle-statNext" data-widget="statNext" />
      </div>
      <div class="drawer-row">
        <label for="cardToggle-todo">待辦事項顯示底框</label>
        <input type="checkbox" id="cardToggle-todo" data-widget="todo" />
      </div>
      <div class="drawer-row">
        <label for="cardToggle-tasks">今日任務顯示底框</label>
        <input type="checkbox" id="cardToggle-tasks" data-widget="tasks" />
      </div>
    </div>

    <div class="drawer-section">
      <h3>外觀</h3>
      <div class="drawer-row">
        <label for="accentPicker">主題色</label>
        <input type="color" id="accentPicker" />
      </div>
      <div class="drawer-row">
        <label for="tickIntervalSelect">刻度單位</label>
        <select id="tickIntervalSelect">
          <option value="15">15 分鐘</option>
          <option value="30">30 分鐘</option>
          <option value="60">1 小時</option>
          <option value="120">2 小時</option>
          <option value="180">3 小時</option>
          <option value="240">4 小時</option>
        </select>
      </div>
    </div>

    <div class="drawer-section">
      <h3>範本</h3>
      <label for="templateSelect" class="template-label">目前使用</label>
      <div class="template-controls">
        <select id="templateSelect"></select>
        <button class="btn icon-btn" id="renameTemplateBtn" title="重新命名">✎</button>
        <button class="btn icon-btn" id="addTemplateBtn" title="新增範本">+</button>
        <button class="btn danger icon-btn" id="deleteTemplateBtn" title="刪除範本">✕</button>
      </div>
    </div>

    <div class="drawer-section">
      <h3>管理時段 · <span id="editingTemplateName">平日</span></h3>
      <div id="zoneList"></div>
      <button class="btn" id="addZoneBtn">+ 新增時段</button>
    </div>
  </div>

<script>
  // ===== 預設值 =====
  const DEFAULT_TEMPLATES = [
    {
      id: "weekday",
      name: "平日",
      zones: [
        { name: "睡眠",   start: 0,  end: 6,  color: "#3b4560" },
        { name: "晨間準備", start: 6,  end: 9,  color: "#ffb454" },
        { name: "工作",   start: 9,  end: 18, color: "#4cc2ff" },
        { name: "晚間",   start: 18, end: 24, color: "#b892ff" },
      ],
    },
    {
      id: "weekend",
      name: "假日",
      zones: [
        { name: "睡眠",   start: 0,  end: 8,  color: "#3b4560" },
        { name: "悠閒早晨", start: 8,  end: 11, color: "#ffb454" },
        { name: "自由時間", start: 11, end: 22, color: "#4cc2ff" },
        { name: "夜晚",   start: 22, end: 24, color: "#b892ff" },
      ],
    },
  ];
  const DEFAULT_ACCENT = "#8b7bff";
  const DEFAULT_TICK_MIN = 180;

  // 每個面板的預設位置/大小(單位:px,相對於畫布)
  const DEFAULT_LAYOUT = {
    clock:        { x: 20,  y: 20,  w: 620, h: 300 },
    statElapsed:  { x: 660, y: 20,  w: 155, h: 140 },
    statRemaining:{ x: 825, y: 20,  w: 155, h: 140 },
    statCurrent:  { x: 660, y: 170, w: 155, h: 150 },
    statNext:     { x: 825, y: 170, w: 155, h: 150 },
    todo:  { x: 20,  y: 340, w: 470, h: 300 },
    tasks: { x: 510, y: 340, w: 470, h: 300 },
  };

  const LS_TEMPLATES = "myClock_templates";
  const LS_ACTIVE_TEMPLATE = "myClock_activeTemplateId";
  const LS_ZONES = "myClock_zones";
  const LS_ACCENT = "myClock_accent";
  const LS_TICK = "myClock_tickIntervalMin";
  const LS_LAYOUT = "myClock_widgetLayout";
  const LS_CARD_PREFS = "myClock_cardPrefs";
  const LS_SNAP_ENABLED = "myClock_snapEnabled";
  const LS_GRID_SIZE = "myClock_gridSize";
  const DEFAULT_CARD_PREFS = {
    clock: false,
    statElapsed: true, statRemaining: true, statCurrent: true, statNext: true,
    todo: true, tasks: true,
  };

  let templates = [];
  let activeTemplateId = null;
  let tickIntervalMin = DEFAULT_TICK_MIN;

  function loadState() {
    try {
      const rawTemplates = localStorage.getItem(LS_TEMPLATES);
      if (rawTemplates) {
        templates = JSON.parse(rawTemplates);
      } else {
        const rawZones = localStorage.getItem(LS_ZONES);
        if (rawZones) {
          templates = [{ id: "default", name: "我的排程", zones: JSON.parse(rawZones) }];
        } else {
          templates = JSON.parse(JSON.stringify(DEFAULT_TEMPLATES));
        }
      }
    } catch { templates = JSON.parse(JSON.stringify(DEFAULT_TEMPLATES)); }
    if (!Array.isArray(templates) || templates.length === 0) {
      templates = JSON.parse(JSON.stringify(DEFAULT_TEMPLATES));
    }

    const savedActiveId = localStorage.getItem(LS_ACTIVE_TEMPLATE);
    activeTemplateId = templates.some((t) => t.id === savedActiveId) ? savedActiveId : templates[0].id;

    const accent = localStorage.getItem(LS_ACCENT) || DEFAULT_ACCENT;
    applyAccent(accent);
    document.getElementById("accentPicker").value = accent;

    tickIntervalMin = parseInt(localStorage.getItem(LS_TICK), 10) || DEFAULT_TICK_MIN;
    document.getElementById("tickIntervalSelect").value = String(tickIntervalMin);
  }
  function saveTemplates() { localStorage.setItem(LS_TEMPLATES, JSON.stringify(templates)); }
  function saveActiveTemplate() { localStorage.setItem(LS_ACTIVE_TEMPLATE, activeTemplateId); }
  function saveAccent(hex) { localStorage.setItem(LS_ACCENT, hex); }
  function saveTickInterval() { localStorage.setItem(LS_TICK, String(tickIntervalMin)); }

  function getCurrentTemplate() {
    return templates.find((t) => t.id === activeTemplateId) || templates[0];
  }

  function hexToRgba(hex, alpha) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
  }
  function applyAccent(hex) {
    document.documentElement.style.setProperty("--accent", hex);
    document.documentElement.style.setProperty("--accent-glow", hexToRgba(hex, 0.55));
    document.documentElement.style.setProperty("--bg-grid", hexToRgba(hex, 0.05));
  }

  const track = document.getElementById("track");
  const marker = document.getElementById("marker");
  const legend = document.getElementById("legend");

  function renderZonesAndLegend() {
    track.querySelectorAll(".zone").forEach((el) => el.remove());
    legend.innerHTML = "";
    const displayZones = getCurrentTemplate().zones;
    displayZones.forEach((z) => {
      const el = document.createElement("div");
      el.className = "zone";
      el.style.left = (z.start / 24 * 100) + "%";
      el.style.width = ((z.end - z.start) / 24 * 100) + "%";
      el.style.background = z.color;
      track.appendChild(el);

      const item = document.createElement("div");
      item.className = "legend-item";
      item.innerHTML = `<span class="swatch" style="background:${z.color}"></span>${z.name}`;
      legend.appendChild(item);
    });
  }

  function renderTrackTicks() {
    track.querySelectorAll(".tick-mark").forEach((el) => el.remove());
    const stepHours = tickIntervalMin / 60;
    for (let h = 0; h <= 24 + 1e-6; h += stepHours) {
      if (h > 24) break;
      const el = document.createElement("div");
      const isFullHour = Math.abs(h - Math.round(h)) < 1e-6;
      el.className = "tick-mark" + (isFullHour ? " major" : "");
      el.style.left = (h / 24 * 100) + "%";
      track.appendChild(el);
    }
  }

  const hourTicks = document.getElementById("hourTicks");
  function renderTicks() {
    hourTicks.innerHTML = "";
    const stepHours = tickIntervalMin / 60;
    for (let h = 0; h <= 24 + 1e-6; h += stepHours) {
      const hh = Math.floor(h) % 24;
      const mm = Math.round((h - Math.floor(h)) * 60);
      if (mm !== 0) continue;
      const span = document.createElement("span");
      span.textContent = String(hh).padStart(2, "0");
      span.style.left = (Math.min(h, 24) / 24 * 100) + "%";
      hourTicks.appendChild(span);
    }
    renderTrackTicks();
  }

  function findCurrentZone(hourFloat) {
    return getCurrentTemplate().zones.find((z) => hourFloat >= z.start && hourFloat < z.end);
  }
  function findNextZone(hourFloat) {
    const displayZones = getCurrentTemplate().zones;
    if (displayZones.length === 0) return null;
    const sorted = [...displayZones].sort((a, b) => a.start - b.start);
    const upcoming = sorted.find((z) => z.start > hourFloat);
    return upcoming || sorted[0];
  }

  function tick() {
    const now = new Date();
    const h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
    const hourFloat = h + m / 60 + s / 3600;

    marker.style.left = (hourFloat / 24 * 100) + "%";

    document.getElementById("liveTime").textContent =
      `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
    document.getElementById("dateLine").textContent =
      now.toLocaleDateString("zh-TW", { year: "numeric", month: "long", day: "numeric", weekday: "long" });

    const secondsSinceMidnight = h * 3600 + m * 60 + s;
    const totalSeconds = 86400;
    const pct = (secondsSinceMidnight / totalSeconds * 100).toFixed(1);
    const remain = totalSeconds - secondsSinceMidnight;
    const rh = String(Math.floor(remain / 3600)).padStart(2, "0");
    const rm = String(Math.floor((remain % 3600) / 60)).padStart(2, "0");
    const rs = String(remain % 60).padStart(2, "0");

    document.getElementById("pctElapsed").textContent = pct + "%";
    document.getElementById("timeLeft").textContent = `${rh}:${rm}:${rs}`;

    const currentZone = findCurrentZone(hourFloat);
    if (currentZone) {
      const remainMinutes = (currentZone.end - hourFloat) * 60;
      let countdownText;
      if (remainMinutes >= 60) {
        countdownText = Math.floor(remainMinutes / 60) + " 小時";
      } else {
        countdownText = Math.max(1, Math.round(remainMinutes)) + " 分鐘";
      }
      document.getElementById("currentZoneLabel").textContent = currentZone.name;
      document.getElementById("currentZoneSubLabel").textContent = countdownText + " 後結束";
    } else {
      document.getElementById("currentZoneLabel").textContent = "--";
      document.getElementById("currentZoneSubLabel").textContent = "目前時段";
    }

    const nextZone = findNextZone(hourFloat);
    document.getElementById("nextZoneLabel").textContent = nextZone ? nextZone.name : "--";
  }

  function hourToTimeStr(hourFloat) {
    const hh = Math.floor(hourFloat);
    const mm = Math.round((hourFloat - hh) * 60);
    return String(hh).padStart(2, "0") + ":" + String(mm).padStart(2, "0");
  }
  function timeStrToHour(timeStr) {
    const [hh, mm] = timeStr.split(":").map(Number);
    return hh + mm / 60;
  }

  const zoneList = document.getElementById("zoneList");

  function renderZoneEditor() {
    zoneList.innerHTML = "";
    const editingZones = getCurrentTemplate().zones;
    editingZones.forEach((z, idx) => {
      const row = document.createElement("div");
      row.className = "zone-row";
      row.innerHTML = `
        <input type="text" value="${z.name}" data-field="name" />
        <input type="time" value="${hourToTimeStr(z.start)}" data-field="start" />
        <span style="color:var(--muted);font-size:0.7rem;">至</span>
        <input type="time" value="${hourToTimeStr(z.end)}" data-field="end" />
        <input type="color" value="${z.color}" data-field="color" />
        <button class="btn danger" data-action="delete">刪除</button>
      `;

      row.querySelectorAll("input").forEach((input) => {
        input.addEventListener("change", () => {
          const field = input.dataset.field;
          if (field === "name") editingZones[idx].name = input.value.trim() || "未命名時段";
          if (field === "start") editingZones[idx].start = timeStrToHour(input.value);
          if (field === "end") editingZones[idx].end = timeStrToHour(input.value);
          if (field === "color") editingZones[idx].color = input.value;
          saveTemplates();
          renderZonesAndLegend();
          renderTrackTicks();
          tick();
        });
      });

      row.querySelector('[data-action="delete"]').addEventListener("click", () => {
        editingZones.splice(idx, 1);
        saveTemplates();
        renderZoneEditor();
        renderZonesAndLegend();
        renderTrackTicks();
        tick();
      });

      zoneList.appendChild(row);
    });
  }

  document.getElementById("addZoneBtn").addEventListener("click", () => {
    getCurrentTemplate().zones.push({ name: "新時段", start: 12, end: 13, color: "#4cc2ff" });
    saveTemplates();
    renderZoneEditor();
    renderZonesAndLegend();
    renderTrackTicks();
    tick();
  });

  // ===== 範本管理 =====
  const templateSelect = document.getElementById("templateSelect");
  const editingTemplateName = document.getElementById("editingTemplateName");

  function renderTemplateSelect() {
    templateSelect.innerHTML = "";
    templates.forEach((t) => {
      const opt = document.createElement("option");
      opt.value = t.id;
      opt.textContent = t.name;
      templateSelect.appendChild(opt);
    });
    templateSelect.value = activeTemplateId;
    editingTemplateName.textContent = getCurrentTemplate().name;
    document.getElementById("deleteTemplateBtn").disabled = templates.length <= 1;
  }

  templateSelect.addEventListener("change", (e) => {
    activeTemplateId = e.target.value;
    saveActiveTemplate();
    editingTemplateName.textContent = getCurrentTemplate().name;
    renderZoneEditor();
    renderZonesAndLegend();
    renderTrackTicks();
    tick();
  });

  document.getElementById("addTemplateBtn").addEventListener("click", () => {
    const newTemplate = {
      id: "tpl_" + Date.now(),
      name: "新範本",
      zones: [{ name: "新時段", start: 0, end: 24, color: "#4cc2ff" }],
    };
    templates.push(newTemplate);
    activeTemplateId = newTemplate.id;
    saveTemplates();
    saveActiveTemplate();
    renderTemplateSelect();
    renderZoneEditor();
    renderZonesAndLegend();
    renderTrackTicks();
    tick();
  });

  document.getElementById("renameTemplateBtn").addEventListener("click", () => {
    const t = getCurrentTemplate();
    const newName = prompt("範本名稱", t.name);
    if (newName === null) return;
    const trimmed = newName.trim();
    if (!trimmed) return;
    t.name = trimmed;
    saveTemplates();
    renderTemplateSelect();
  });

  document.getElementById("deleteTemplateBtn").addEventListener("click", () => {
    if (templates.length <= 1) return;
    const t = getCurrentTemplate();
    if (!confirm(`確定要刪除範本「${t.name}」嗎?`)) return;
    const idx = templates.indexOf(t);
    templates.splice(idx, 1);
    activeTemplateId = templates[0].id;
    saveTemplates();
    saveActiveTemplate();
    renderTemplateSelect();
    renderZoneEditor();
    renderZonesAndLegend();
    renderTrackTicks();
    tick();
  });

  document.getElementById("accentPicker").addEventListener("input", (e) => {
    applyAccent(e.target.value);
    saveAccent(e.target.value);
  });

  document.getElementById("tickIntervalSelect").addEventListener("change", (e) => {
    tickIntervalMin = parseInt(e.target.value, 10);
    saveTickInterval();
    renderTicks();
  });

  // ===== 待辦事項 / 今日任務:呼叫 Vercel 後端 =====
  const TODOS_URL = "https://clock-notion-backend.vercel.app/api/todos";
  const TASKS_URL = "https://clock-notion-backend.vercel.app/api/tasks";

  async function loadList(url, statusElId, listElId, emptyText) {
    const statusEl = document.getElementById(statusElId);
    const listEl = document.getElementById(listElId);
    try {
      const res = await fetch(url);
      const data = await res.json();
      const items = data.todos || data.tasks || [];
      if (items.length === 0) {
        statusEl.textContent = emptyText;
        listEl.innerHTML = "";
        return;
      }
      listEl.innerHTML = items.map((t) => `<li>${t.title}</li>`).join("");
      statusEl.textContent = `已同步 · ${items.length} 筆`;
      statusEl.classList.remove("error");
    } catch (err) {
      statusEl.textContent = "連接失敗";
      statusEl.classList.add("error");
    }
  }
  function loadTodos() { loadList(TODOS_URL, "todoStatus", "todoList", "目前沒有待辦事項"); }
  function loadTasks() { loadList(TASKS_URL, "tasksStatus", "tasksList", "今天沒有安排任務"); }

  // ===== 設定抽屜開關 =====
  const settingsToggle = document.getElementById("settingsToggle");
  const settingsDrawer = document.getElementById("settingsDrawer");
  const drawerOverlay = document.getElementById("drawerOverlay");
  const closeDrawer = document.getElementById("closeDrawer");

  function openDrawer() {
    settingsDrawer.classList.add("open");
    drawerOverlay.classList.add("open");
  }
  function closeDrawerFn() {
    settingsDrawer.classList.remove("open");
    drawerOverlay.classList.remove("open");
  }
  settingsToggle.addEventListener("click", openDrawer);
  closeDrawer.addEventListener("click", closeDrawerFn);
  drawerOverlay.addEventListener("click", closeDrawerFn);

  // ===== 格線對齊 =====
  let snapEnabled = true;
  let gridSize = 20;

  function loadGridSettings() {
    const rawSnap = localStorage.getItem(LS_SNAP_ENABLED);
    snapEnabled = rawSnap === null ? true : rawSnap === "true";
    gridSize = parseInt(localStorage.getItem(LS_GRID_SIZE), 10) || 20;

    document.getElementById("snapToggle").checked = snapEnabled;
    document.getElementById("gridSizeSelect").value = String(gridSize);
    document.getElementById("canvas").style.setProperty("--grid-size", gridSize + "px");
  }
  function snapValue(v) {
    if (!snapEnabled) return v;
    return Math.round(v / gridSize) * gridSize;
  }

  document.getElementById("snapToggle").addEventListener("change", (e) => {
    snapEnabled = e.target.checked;
    localStorage.setItem(LS_SNAP_ENABLED, String(snapEnabled));
  });
  document.getElementById("gridSizeSelect").addEventListener("change", (e) => {
    gridSize = parseInt(e.target.value, 10);
    localStorage.setItem(LS_GRID_SIZE, String(gridSize));
    document.getElementById("canvas").style.setProperty("--grid-size", gridSize + "px");
  });

  // ===== 面板拖動 / 縮放 / 版面儲存 =====
  let zCounter = 10;

  function loadLayout() {
    try {
      const raw = localStorage.getItem(LS_LAYOUT);
      return raw ? JSON.parse(raw) : {};
    } catch { return {}; }
  }
  function saveLayout(layout) {
    localStorage.setItem(LS_LAYOUT, JSON.stringify(layout));
  }

  function applyLayoutToWidgets() {
    const saved = loadLayout();
    document.querySelectorAll(".widget").forEach((widget) => {
      const key = widget.dataset.widget;
      const rect = saved[key] || DEFAULT_LAYOUT[key];
      widget.style.left = rect.x + "px";
      widget.style.top = rect.y + "px";
      widget.style.width = rect.w + "px";
      widget.style.height = rect.h + "px";
    });
  }

  function currentLayoutFromDOM() {
    const layout = {};
    document.querySelectorAll(".widget").forEach((widget) => {
      const key = widget.dataset.widget;
      layout[key] = {
        x: widget.offsetLeft,
        y: widget.offsetTop,
        w: widget.offsetWidth,
        h: widget.offsetHeight,
      };
    });
    return layout;
  }

  function bringToFront(widget) {
    zCounter += 1;
    widget.style.zIndex = zCounter;
  }

  function makeDraggable(widget) {
    const handle = widget.querySelector(".widget-handle");
    handle.addEventListener("pointerdown", (e) => {
      bringToFront(widget);
      const startX = e.clientX, startY = e.clientY;
      const startLeft = widget.offsetLeft, startTop = widget.offsetTop;
      const canvas = document.getElementById("canvas");

      function onMove(ev) {
        let newLeft = startLeft + (ev.clientX - startX);
        let newTop = startTop + (ev.clientY - startY);
        newLeft = Math.max(0, snapValue(newLeft));
        newTop = Math.max(0, snapValue(newTop));
        widget.style.left = newLeft + "px";
        widget.style.top = newTop + "px";
      }
      function onUp() {
        document.removeEventListener("pointermove", onMove);
        document.removeEventListener("pointerup", onUp);
        saveLayout(currentLayoutFromDOM());
      }
      document.addEventListener("pointermove", onMove);
      document.addEventListener("pointerup", onUp);
    });
  }

  function makeResizable(widget) {
    widget.addEventListener("pointerdown", () => bringToFront(widget));
    const resizeObserver = new ResizeObserver(() => {
      clearTimeout(widget._resizeSaveTimer);
      widget._resizeSaveTimer = setTimeout(() => {
        if (snapEnabled) {
          const snappedW = Math.max(widget.style.minWidth ? parseInt(widget.style.minWidth) : 240, snapValue(widget.offsetWidth));
          const snappedH = Math.max(160, snapValue(widget.offsetHeight));
          widget.style.width = snappedW + "px";
          widget.style.height = snappedH + "px";
        }
        saveLayout(currentLayoutFromDOM());
      }, 300);
    });
    resizeObserver.observe(widget);
  }

  document.querySelectorAll(".widget").forEach((widget) => {
    makeDraggable(widget);
    makeResizable(widget);
  });

  document.getElementById("resetLayoutBtn").addEventListener("click", () => {
    if (!confirm("確定要把所有面板的位置與大小恢復成預設值嗎?")) return;
    localStorage.removeItem(LS_LAYOUT);
    applyLayoutToWidgets();
  });

  // ===== 編輯模式 / 檢視模式切換 =====
  const editModeToggle = document.getElementById("editModeToggle");
  editModeToggle.addEventListener("click", () => {
    const isEdit = document.body.classList.toggle("edit-mode");
    editModeToggle.classList.toggle("active", isEdit);
    editModeToggle.textContent = isEdit ? "✓ 完成編輯" : "✏ 編輯版面";
  });

  // ===== 個別面板的底框顯示偏好 =====
  function loadCardPrefs() {
    try {
      const raw = localStorage.getItem(LS_CARD_PREFS);
      return raw ? { ...DEFAULT_CARD_PREFS, ...JSON.parse(raw) } : { ...DEFAULT_CARD_PREFS };
    } catch { return { ...DEFAULT_CARD_PREFS }; }
  }
  function saveCardPrefs(prefs) {
    localStorage.setItem(LS_CARD_PREFS, JSON.stringify(prefs));
  }
  function applyCardPrefs() {
    const prefs = loadCardPrefs();
    document.querySelectorAll(".widget").forEach((widget) => {
      const key = widget.dataset.widget;
      widget.classList.toggle("show-card", !!prefs[key]);
    });
    document.querySelectorAll("[data-widget][type=checkbox]").forEach((cb) => {
      cb.checked = !!prefs[cb.dataset.widget];
    });
  }
  document.querySelectorAll("[data-widget][type=checkbox]").forEach((cb) => {
    cb.addEventListener("change", () => {
      const prefs = loadCardPrefs();
      prefs[cb.dataset.widget] = cb.checked;
      saveCardPrefs(prefs);
      applyCardPrefs();
    });
  });

  // ===== 啟動 =====
  loadState();
  loadGridSettings();
  applyLayoutToWidgets();
  applyCardPrefs();
  renderTemplateSelect();
  renderZonesAndLegend();
  renderTicks();
  renderZoneEditor();
  tick();
  setInterval(tick, 1000);
  loadTodos();
  loadTasks();
</script>
</body>
</html>
